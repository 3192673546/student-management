<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        .btn-action {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }
        .btn-edit {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            color: white;
        }
        .btn-delete {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            border: none;
            color: white;
        }
        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 10px 30px;
            border-radius: 25px;
        }
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .alert-success {
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="card">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h3 class="mb-1"><i class="bi bi-mortarboard-fill me-2"></i>学生管理系统</h3>
                        <small class="opacity-75">Spring Boot + MyBatis + Thymeleaf</small>
                    </div>
                    <a th:href="@{/add}" class="btn btn-light btn-add">
                        <i class="bi bi-plus-circle me-2"></i>添加学生
                    </a>
                </div>
            </div>
            <div class="card-body p-4">
                <!-- 成功提示 -->
                <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle me-2"></i><span th:text="${msg}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- 学生列表 -->
                <div th:if="${#lists.isEmpty(students)}" class="empty-state">
                    <i class="bi bi-inbox"></i>
                    <h5>暂无学生数据</h5>
                    <p>点击上方按钮添加第一个学生</p>
                </div>

                <div th:unless="${#lists.isEmpty(students)}" class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th scope="col" style="width: 80px">#</th>
                                <th scope="col">学号</th>
                                <th scope="col">姓名</th>
                                <th scope="col" style="width: 200px">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="student, iterStat : ${students}">
                                <td th:text="${iterStat.count}"></td>
                                <td><span class="badge bg-secondary" th:text="${student.id}"></span></td>
                                <td th:text="${student.name}"></td>
                                <td>
                                    <a th:href="@{/edit/{id}(id=${student.id})}" class="btn btn-edit btn-action me-2">
                                        <i class="bi bi-pencil me-1"></i>编辑
                                    </a>
                                    <a th:href="@{/delete/{id}(id=${student.id})}" class="btn btn-delete btn-action"
                                       onclick="return confirm('确定要删除这个学生吗？')">
                                        <i class="bi bi-trash me-1"></i>删除
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 统计信息 -->
                <div th:unless="${#lists.isEmpty(students)}" class="text-muted mt-3">
                    <small><i class="bi bi-people me-1"></i>共 <span th:text="${#lists.size(students)}"></span> 名学生</small>
                </div>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="text-center text-white mt-4">
            <small>Powered by Spring Boot + MyBatis + Thymeleaf</small>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
